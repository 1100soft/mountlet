[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-mount-manager"
version = "0.1.0"
description = "TUI and tools for mounting rclone remotes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
cloud-mount-manager = "cloud_mount_manager.tui:main"
cloud-config-import = "cloud_mount_manager.config_tools.import_config:main"
cloud-config-export = "cloud_mount_manager.config_tools.export_config:main"
cloud-config-verify = "cloud_mount_manager.config_tools.verify_config:main"
cloud-config-reconnect = "cloud_mount_manager.config_tools.reconnect_config:main"
cloud-config-path = "cloud_mount_manager.config_tools.path_config:main"
