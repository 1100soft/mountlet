[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mountlet"
version = "0.2.2"
description = "CLI and tray tools for mounting rclone remotes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Eric Holt"},
]
keywords = ["rclone", "mount", "cloud-storage", "tui", "fuse"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]

[project.optional-dependencies]
tray = [
  "PySide6>=6.7",
  "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.4",
  "twine>=6",
]

[project.urls]
Homepage = "https://github.com/eric-holt/mountlet"
Issues = "https://github.com/eric-holt/mountlet/issues"

[project.scripts]
mountlet = "mountlet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mountlet = ["assets/*.png"]

[tool.ruff]
line-length = 120
target-version = "py310"
