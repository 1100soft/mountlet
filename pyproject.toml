[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-mount-manager"
version = "0.1.1"
description = "TUI and tools for mounting rclone remotes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Eric Holt"},
]
keywords = ["rclone", "mount", "cloud-storage", "tui", "fuse"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]

[project.optional-dependencies]
tray = [
  "PySide6>=6.7",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.4",
  "twine>=6",
]

[project.urls]
Homepage = "https://github.com/eric-holt/cloud-mount-manager"
Issues = "https://github.com/eric-holt/cloud-mount-manager/issues"

[project.scripts]
cloud-mount-manager = "cloud_mount_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
