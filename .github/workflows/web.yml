name: Website integration
'on':
  pull_request:
    paths:
    - .github/workflows/web.yml
    - .github/workflows/package.yml
    - web/**
    - functions/**
    - package.json
    - package-lock.json
    - wrangler.toml
    - '!web/**/*.md'
  push:
    branches:
    - main
    - wip
    paths:
    - .github/workflows/web.yml
    - .github/workflows/package.yml
    - web/**
    - functions/**
    - package.json
    - package-lock.json
    - wrangler.toml
    - '!web/**/*.md'
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: Website and release tooling
    uses: 1100soft/CI/.github/workflows/node-check.yml@7ac17c500e9b30cdcddeefcd5232ff937c76946d
    with:
      check-command: |
        node --check web/script.js
        npm run web:release:check
        npm run web:release:test
        npm run web:notices:test
        npm run web:reports:test
