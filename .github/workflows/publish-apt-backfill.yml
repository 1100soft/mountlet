name: Resume tested APT publication
'on':
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Tagged Native package CI run retaining an apt-packages artifact
        required: true
        type: string
      channel:
        description: Expected source channel (never transforms package versions)
        required: true
        type: choice
        options: [stable, preview]
permissions:
  actions: read
  contents: read
concurrency:
  group: mountlet-apt-publication
  queue: max
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      debian-version: ${{ steps.source.outputs.debian-version }}
    steps:
    - name: Validate trusted source run
      id: source
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        CHANNEL: ${{ inputs.channel }}
      run: |
        set -euo pipefail
        [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
        run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")
        test "$(jq -r .name <<<"$run")" = "Native package CI"
        test "$(jq -r .path <<<"$run")" = ".github/workflows/package.yml"
        test "$(jq -r .event <<<"$run")" = push
        branch=$(jq -r .head_branch <<<"$run")
        if [ "$CHANNEL" = stable ]; then
          [[ "$branch" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${branch#v}"
        else
          [[ "$branch" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[1-9][0-9]*$ ]]
          version="${branch#v}"
          version="${version/-preview./~preview.}"
        fi
        jobs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" --jq '.jobs[]')
        test "$(jq -s '[.[] | select(.name == "Resolve preview or stable release" and .conclusion == "success")] | length' <<<"$jobs")" = 1
        test "$(jq -s '[.[] | select(.name | test("Package \\(linux-x64 / (lean|standard)\\)$")) | select(.conclusion == "success")] | length' <<<"$jobs")" = 2
        echo "debian-version=$version" >> "$GITHUB_OUTPUT"
  publish:
    needs: source
    uses: 1100soft/CI/.github/workflows/apt-publish.yml@7ac17c500e9b30cdcddeefcd5232ff937c76946d
    with:
      shared-ci-ref: 7ac17c500e9b30cdcddeefcd5232ff937c76946d
      repository-url: https://apt.1100soft.com
      source-run-id: ${{ inputs.source_run_id }}
      artifact-inputs: '{"apt-packages": "apt-packages"}'
      prepare-command: |
        set -euo pipefail
        packages=(apt-packages/*.deb)
        test "${#packages[@]}" -eq 2
        for package in "${packages[@]}"; do
          test "$(dpkg-deb --field "$package" Version)" = "${{ needs.source.outputs.debian-version }}"
          name=$(dpkg-deb --field "$package" Package)
          if [ "${{ inputs.channel }}" = stable ]; then
            [[ "$name" = mountlet || "$name" = mountlet-lean ]]
          else
            [[ "$name" = mountlet-preview || "$name" = mountlet-lean-preview ]]
          fi
        done
    secrets:
      APT_DISPATCH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
