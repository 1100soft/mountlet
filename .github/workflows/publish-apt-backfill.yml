name: Publish tested Linux packages to APT
'on':
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Native package CI run containing the tested Linux artifacts
        required: true
        type: string
      channel:
        description: APT channel to publish
        required: true
        type: choice
        options:
        - stable
        - preview
permissions:
  actions: read
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      release-id: ${{ steps.source.outputs.release_id }}
    steps:
    - name: Validate trusted source run
      id: source
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        CHANNEL: ${{ inputs.channel }}
      run: |
        set -euo pipefail
        [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
        run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")
        test "$(jq -r .conclusion <<<"$run")" = success
        test "$(jq -r .name <<<"$run")" = "Native package CI"
        branch=$(jq -r .head_branch <<<"$run")
        event=$(jq -r .event <<<"$run")
        run_number=$(jq -r .run_number <<<"$run")
        sha=$(jq -r .head_sha <<<"$run")
        if [ "$CHANNEL" = stable ]; then
          test "$event" = push
          [[ "$branch" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_id="$branch"
        else
          test "$event" = workflow_dispatch
          test "$branch" = wip
          release_id="${run_number}+g${sha:0:7}"
        fi
        echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
  publish:
    needs: source
    uses: 1100soft/CI/.github/workflows/apt-publish.yml@859fc753347512c1e64d50f487251d41b0778925
    with:
      source-run-id: ${{ inputs.source_run_id }}
      artifact-inputs: '{"mountlet-linux-x64-standard": "apt-input/standard", "mountlet-linux-x64-lean": "apt-input/lean"}'
      prepare-command: |
        bash .github/scripts/prepare-apt-packages.sh \
          apt-input/standard/*.deb apt-input/lean/*.deb apt-packages \
          "${{ inputs.channel }}" "${{ needs.source.outputs.release-id }}"
        # This maintenance workflow adds only the missing lean identity. The
        # bundled identity from the source run is already immutable in APT;
        # repacking preview metadata would produce different archive bytes.
        if [ "${{ inputs.channel }}" = stable ]; then
          rm apt-packages/mountlet_*.deb
        else
          rm apt-packages/mountlet-preview_*.deb
        fi
        test "$(find apt-packages -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 1
    secrets:
      APT_DISPATCH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
