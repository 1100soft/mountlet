name: Python package check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build and check Python package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and build tools
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        working-directory: app
        run: python packaging/run_tests.py

      - name: Compile source
        working-directory: app
        run: python -m compileall -q src tests

      - name: Build package
        working-directory: app
        run: python -m build

      - name: Check package metadata
        working-directory: app
        run: python -m twine check dist/*.whl dist/*.tar.gz
