name: App CI
'on':
  pull_request:
    paths:
    - .github/workflows/ci.yml
    - app/**
    - '!app/**/*.md'
    - '!app/docs/**'
  push:
    branches:
    - main
    - wip
    paths:
    - .github/workflows/ci.yml
    - app/**
    - '!app/**/*.md'
    - '!app/docs/**'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    uses: 1100soft/CI/.github/workflows/tauri-check.yml@31cd08b2a9314c358ce2589a095b5cbeb8dcadf7
    with:
      app-directory: app
      runner-matrix: '["ubuntu-24.04"]'
      clippy: true
      native-test-command: cargo test --locked -j 2 --manifest-path src-tauri/Cargo.toml
      post-native-command: |
        cargo build --locked --manifest-path src-tauri/Cargo.toml
        version=$(node -p "require('./package.json').version")
        test "$(src-tauri/target/debug/mountlet --version)" = "Mountlet ${version}"
