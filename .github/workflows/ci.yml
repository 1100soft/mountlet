name: CI

on:
  pull_request:
  push:
    branches: [main, master, wip]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Tauri desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Check and build frontend
        working-directory: app
        run: npm run build
      - name: Run Rust tests
        working-directory: app
        run: cargo test --locked -j 2 --manifest-path src-tauri/Cargo.toml
      - name: Lint Rust targets
        working-directory: app
        run: cargo clippy --locked -j 2 --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build and probe desktop executable
        working-directory: app
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml
          version=$(node -p "require('./package.json').version")
          test "$(src-tauri/target/debug/mountlet --version)" = "Mountlet ${version}"

  web:
    name: Website and release tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate website and release system
        run: |
          node --check web/script.js
          npm run web:release:check
          npm run web:release:test
          npm run web:notices:test
