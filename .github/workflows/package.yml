name: Native package CI
'on':
  pull_request:
    paths:
    - .github/workflows/package.yml
    - .github/scripts/prepare-apt-packages.sh
    - .github/scripts/*release-policy.mjs
    - .github/scripts/*release-pipeline.mjs
    - .github/actions/**
    - app/**
    - '!app/**/*.md'
    - '!app/docs/**'
    - .github/scripts/package-matrix.json
    - .github/workflows/package-platform.yml
  push:
    branches:
    - main
    - wip
    tags:
    - v*
    - '!cerberus/source/**'
    paths:
    - .github/workflows/package.yml
    - .github/scripts/prepare-apt-packages.sh
    - .github/scripts/*release-policy.mjs
    - .github/scripts/*release-pipeline.mjs
    - .github/actions/**
    - app/**
    - '!app/**/*.md'
    - '!app/docs/**'
    - .github/scripts/package-matrix.json
    - .github/workflows/package-platform.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: native-package-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  release-policy:
    name: Resolve preview or stable release
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.policy.outputs.channel }}
      upload: ${{ steps.policy.outputs.upload }}
      publish-apt: ${{ steps.policy.outputs.publish-apt }}
      release-version: ${{ steps.policy.outputs.release-version }}
      debian-version: ${{ steps.policy.outputs.debian-version }}
      linux-matrix: ${{ steps.policy.outputs.linux-matrix }}
      other-matrix: ${{ steps.policy.outputs.other-matrix }}
      source-epoch: ${{ steps.policy.outputs.source-epoch }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - run: node .github/scripts/test-release-policy.mjs
    - run: node .github/scripts/test-release-pipeline.mjs
    - run: node app/scripts/check-version.mjs
    - id: policy
      run: node .github/scripts/release-policy.mjs
    if: ${{ !startsWith(github.ref, 'refs/tags/cerberus/source/') }}
  package-linux:
    needs: release-policy
    if: ${{ needs.release-policy.outputs.upload == 'true' || github.event_name != 'push' }}
    uses: ./.github/workflows/package-platform.yml
    with:
      matrix: ${{ needs.release-policy.outputs.linux-matrix }}
      channel: ${{ needs.release-policy.outputs.channel }}
      release-version: ${{ needs.release-policy.outputs.release-version }}
      source-epoch: ${{ needs.release-policy.outputs.source-epoch }}
    secrets:
      build-environment: ${{ format('{{"MOUNTLET_DRIVE_CLIENT_ID":{0},"MOUNTLET_DRIVE_CLIENT_SECRET":{1},"MOUNTLET_GPHOTOS_CLIENT_ID":{2},"MOUNTLET_GPHOTOS_CLIENT_SECRET":{3},"MOUNTLET_DROPBOX_CLIENT_ID":{4},"MOUNTLET_DROPBOX_CLIENT_SECRET":{5},"MOUNTLET_ONEDRIVE_CLIENT_ID":{6},"MOUNTLET_ONEDRIVE_CLIENT_SECRET":{7},"MOUNTLET_BOX_CLIENT_ID":{8},"MOUNTLET_BOX_CLIENT_SECRET":{9},"MOUNTLET_PCLOUD_CLIENT_ID":{10},"MOUNTLET_PCLOUD_CLIENT_SECRET":{11}}}',
        toJSON(format('{0}', secrets.MOUNTLET_DRIVE_CLIENT_ID)), toJSON(format('{0}', secrets.MOUNTLET_DRIVE_CLIENT_SECRET)), toJSON(format('{0}',
        secrets.MOUNTLET_GPHOTOS_CLIENT_ID)), toJSON(format('{0}', secrets.MOUNTLET_GPHOTOS_CLIENT_SECRET)), toJSON(format('{0}', secrets.MOUNTLET_DROPBOX_CLIENT_ID)),
        toJSON(format('{0}', secrets.MOUNTLET_DROPBOX_CLIENT_SECRET)), toJSON(format('{0}', secrets.MOUNTLET_ONEDRIVE_CLIENT_ID)), toJSON(format('{0}',
        secrets.MOUNTLET_ONEDRIVE_CLIENT_SECRET)), toJSON(format('{0}', secrets.MOUNTLET_BOX_CLIENT_ID)), toJSON(format('{0}', secrets.MOUNTLET_BOX_CLIENT_SECRET)),
        toJSON(format('{0}', secrets.MOUNTLET_PCLOUD_CLIENT_ID)), toJSON(format('{0}', secrets.MOUNTLET_PCLOUD_CLIENT_SECRET))) }}
  package-other:
    needs: release-policy
    if: ${{ needs.release-policy.outputs.upload == 'true' || github.event_name != 'push' }}
    uses: ./.github/workflows/package-platform.yml
    with:
      matrix: ${{ needs.release-policy.outputs.other-matrix }}
      channel: ${{ needs.release-policy.outputs.channel }}
      release-version: ${{ needs.release-policy.outputs.release-version }}
      source-epoch: ${{ needs.release-policy.outputs.source-epoch }}
    secrets:
      build-environment: ${{ format('{{"MOUNTLET_DRIVE_CLIENT_ID":{0},"MOUNTLET_DRIVE_CLIENT_SECRET":{1},"MOUNTLET_GPHOTOS_CLIENT_ID":{2},"MOUNTLET_GPHOTOS_CLIENT_SECRET":{3},"MOUNTLET_DROPBOX_CLIENT_ID":{4},"MOUNTLET_DROPBOX_CLIENT_SECRET":{5},"MOUNTLET_ONEDRIVE_CLIENT_ID":{6},"MOUNTLET_ONEDRIVE_CLIENT_SECRET":{7},"MOUNTLET_BOX_CLIENT_ID":{8},"MOUNTLET_BOX_CLIENT_SECRET":{9},"MOUNTLET_PCLOUD_CLIENT_ID":{10},"MOUNTLET_PCLOUD_CLIENT_SECRET":{11}}}',
        toJSON(format('{0}', secrets.MOUNTLET_DRIVE_CLIENT_ID)), toJSON(format('{0}', secrets.MOUNTLET_DRIVE_CLIENT_SECRET)), toJSON(format('{0}',
        secrets.MOUNTLET_GPHOTOS_CLIENT_ID)), toJSON(format('{0}', secrets.MOUNTLET_GPHOTOS_CLIENT_SECRET)), toJSON(format('{0}', secrets.MOUNTLET_DROPBOX_CLIENT_ID)),
        toJSON(format('{0}', secrets.MOUNTLET_DROPBOX_CLIENT_SECRET)), toJSON(format('{0}', secrets.MOUNTLET_ONEDRIVE_CLIENT_ID)), toJSON(format('{0}',
        secrets.MOUNTLET_ONEDRIVE_CLIENT_SECRET)), toJSON(format('{0}', secrets.MOUNTLET_BOX_CLIENT_ID)), toJSON(format('{0}', secrets.MOUNTLET_BOX_CLIENT_SECRET)),
        toJSON(format('{0}', secrets.MOUNTLET_PCLOUD_CLIENT_ID)), toJSON(format('{0}', secrets.MOUNTLET_PCLOUD_CLIENT_SECRET))) }}
  publish-apt:
    name: Publish Linux package to APT
    needs:
    - release-policy
    - package-linux
    if: ${{ !cancelled() && needs.release-policy.result == 'success' && needs.package-linux.result == 'success' && needs.release-policy.outputs.publish-apt
      == 'true' }}
    permissions:
      contents: read
      actions: read
    uses: 1100soft/CI/.github/workflows/apt-publish.yml@7ac17c500e9b30cdcddeefcd5232ff937c76946d
    with:
      artifact-inputs: '{"mountlet-linux-x64-standard": "apt-input/standard", "mountlet-linux-x64-lean": "apt-input/lean"}'
      prepare-command: |
        export SOURCE_DATE_EPOCH="${{ needs.release-policy.outputs.source-epoch }}"
        bash .github/scripts/prepare-apt-packages.sh \
          apt-input/standard/*.deb apt-input/lean/*.deb apt-packages \
          "${{ needs.release-policy.outputs.channel == 'production' && 'stable' || 'preview' }}" \
          "${{ needs.release-policy.outputs.debian-version }}"
      repository-url: https://apt.1100soft.com
      shared-ci-ref: 7ac17c500e9b30cdcddeefcd5232ff937c76946d
    secrets:
      APT_DISPATCH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
    concurrency:
      group: mountlet-apt-publication
      queue: max
      cancel-in-progress: false
  upload-installers:
    name: Upload installers to R2
    timeout-minutes: 25
    needs:
    - release-policy
    - package-linux
    - package-other
    runs-on: ubuntu-24.04
    if: needs.release-policy.outputs.upload == 'true'
    env:
      MOUNTLET_BUILD_CHANNEL: ${{ needs.release-policy.outputs.channel }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      MOUNTLET_R2_BUCKET: ${{ vars[needs.release-policy.outputs.channel == 'preview' && 'MOUNTLET_PREVIEW_R2_BUCKET' || 'MOUNTLET_PRODUCTION_R2_BUCKET']
        }}
      MOUNTLET_RELEASE_VERSION: ${{ needs.release-policy.outputs.release-version }}
      MOUNTLET_RELEASE_QUALIFIER: ''
    steps:
    - uses: actions/checkout@v5
    - uses: actions/download-artifact@v4
      with:
        pattern: mountlet-*
        path: release-artifacts
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - name: Verify installer publication rules
      run: node web/tools/test-release-r2.mjs
    - name: Check upload configuration
      shell: bash
      run: |
        test -n "$CLOUDFLARE_ACCOUNT_ID"
        test -n "$CLOUDFLARE_R2_ACCESS_KEY_ID"
        test -n "$CLOUDFLARE_R2_SECRET_ACCESS_KEY"
        test -n "$MOUNTLET_R2_BUCKET"
    - name: Upload installers
      timeout-minutes: 20
      run: |
        npm run web:r2:upload -- "$MOUNTLET_R2_BUCKET" release-artifacts --remote
    concurrency:
      group: mountlet-r2-${{ needs.release-policy.outputs.channel }}
      queue: max
      cancel-in-progress: false
  release-result:
    name: Release result for CI-fix automation
    needs:
    - release-policy
    - package-linux
    - package-other
    - publish-apt
    - upload-installers
    if: ${{ always() && github.ref_type == 'tag' && !startsWith(github.ref, 'refs/tags/cerberus/source/') }}
    runs-on: ubuntu-24.04
    steps:
    - env:
        RESULTS: ${{ toJSON(needs) }}
      run: |-
        node --input-type=module <<'NODE'
        const results = JSON.parse(process.env.RESULTS);
        const failed = Object.entries(results).filter(([, job]) => job.result !== 'success');
        for (const [name, job] of failed) console.error(`::error::${name}: ${job.result}`);
        if (failed.length) process.exit(1);
        NODE
