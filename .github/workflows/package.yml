name: Native package CI
'on':
  workflow_dispatch:
    inputs:
      publish_apt_preview:
        description: Publish Linux builds as mountlet-preview and mountlet-lean-preview
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
    - .github/workflows/package.yml
    - .github/scripts/prepare-apt-packages.sh
    - .github/scripts/*release-policy.mjs
    - .github/actions/**
    - app/**
    - '!app/**/*.md'
    - '!app/docs/**'
  push:
    branches:
    - main
    - wip
    tags:
    - '**'
    paths:
    - .github/workflows/package.yml
    - .github/scripts/prepare-apt-packages.sh
    - .github/scripts/*release-policy.mjs
    - .github/actions/**
    - app/**
    - '!app/**/*.md'
    - '!app/docs/**'
permissions:
  contents: read
concurrency:
  group: native-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-policy:
    name: Resolve preview or stable release
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.policy.outputs.channel }}
      upload: ${{ steps.policy.outputs.upload }}
      publish-apt: ${{ steps.policy.outputs.publish-apt }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - run: node .github/scripts/test-release-policy.mjs
    - id: policy
      env:
        PUBLISH_APT_PREVIEW: ${{ inputs.publish_apt_preview }}
      run: node .github/scripts/release-policy.mjs
  package:
    needs: release-policy
    uses: 1100soft/CI/.github/workflows/tauri-package.yml@31cd08b2a9314c358ce2589a095b5cbeb8dcadf7
    with:
      app-directory: app
      artifact-prefix: mountlet
      version-check-command: node ../.github/scripts/test-release-policy.mjs && node scripts/check-version.mjs
      build-matrix: |
        {
          "include": [
            {
              "label": "Linux x64",
              "platform": "linux-x64",
              "resource": "linux-x86_64",
              "rclone_os": "linux",
              "rclone_arch": "amd64",
              "variant": "lean",
              "variant_label": "system rclone",
              "bundled": false,
              "installer": "mountlet-linux-x64-system-rclone.deb",
              "os": "ubuntu-24.04",
              "artifact": "mountlet-linux-x64-lean",
              "artifact-path": "app/artifacts/mountlet-linux-x64-system-rclone.deb"
            },
            {
              "label": "Linux x64",
              "platform": "linux-x64",
              "resource": "linux-x86_64",
              "rclone_os": "linux",
              "rclone_arch": "amd64",
              "variant": "standard",
              "variant_label": "bundled rclone",
              "bundled": true,
              "installer": "mountlet-linux-x64-bundled-rclone.deb",
              "os": "ubuntu-24.04",
              "artifact": "mountlet-linux-x64-standard",
              "artifact-path": "app/artifacts/mountlet-linux-x64-bundled-rclone.deb"
            },
            {
              "label": "Windows x64",
              "platform": "windows-x64",
              "resource": "windows-x86_64",
              "rclone_os": "windows",
              "rclone_arch": "amd64",
              "variant": "lean",
              "variant_label": "system rclone",
              "bundled": false,
              "installer": "mountlet-windows-x64-system-rclone-setup.exe",
              "os": "windows-2025",
              "artifact": "mountlet-windows-x64-lean",
              "artifact-path": "app/artifacts/mountlet-windows-x64-system-rclone-setup.exe"
            },
            {
              "label": "Windows x64",
              "platform": "windows-x64",
              "resource": "windows-x86_64",
              "rclone_os": "windows",
              "rclone_arch": "amd64",
              "variant": "standard",
              "variant_label": "bundled rclone",
              "bundled": true,
              "installer": "mountlet-windows-x64-bundled-rclone-setup.exe",
              "msix": "mountlet-windows-x64-bundled-rclone.msix",
              "os": "windows-2025",
              "artifact": "mountlet-windows-x64-standard",
              "artifact-path": "app/artifacts/mountlet-windows-x64-bundled-rclone-setup.exe"
            },
            {
              "label": "macOS arm64",
              "platform": "macos-arm64",
              "resource": "macos-aarch64",
              "rclone_os": "osx",
              "rclone_arch": "arm64",
              "variant": "lean",
              "variant_label": "system rclone",
              "bundled": false,
              "installer": "mountlet-macos-arm64-system-rclone.dmg",
              "os": "macos-15",
              "artifact": "mountlet-macos-arm64-lean",
              "artifact-path": "app/artifacts/mountlet-macos-arm64-system-rclone.dmg"
            },
            {
              "label": "macOS arm64",
              "platform": "macos-arm64",
              "resource": "macos-aarch64",
              "rclone_os": "osx",
              "rclone_arch": "arm64",
              "variant": "standard",
              "variant_label": "bundled rclone",
              "bundled": true,
              "installer": "mountlet-macos-arm64-bundled-rclone.dmg",
              "os": "macos-15",
              "artifact": "mountlet-macos-arm64-standard",
              "artifact-path": "app/artifacts/mountlet-macos-arm64-bundled-rclone.dmg"
            },
            {
              "label": "macOS x64",
              "platform": "macos-x64",
              "resource": "macos-x86_64",
              "rclone_os": "osx",
              "rclone_arch": "amd64",
              "variant": "lean",
              "variant_label": "system rclone",
              "bundled": false,
              "installer": "mountlet-macos-x64-system-rclone.dmg",
              "os": "macos-15-intel",
              "artifact": "mountlet-macos-x64-lean",
              "artifact-path": "app/artifacts/mountlet-macos-x64-system-rclone.dmg"
            },
            {
              "label": "macOS x64",
              "platform": "macos-x64",
              "resource": "macos-x86_64",
              "rclone_os": "osx",
              "rclone_arch": "amd64",
              "variant": "standard",
              "variant_label": "bundled rclone",
              "bundled": true,
              "installer": "mountlet-macos-x64-bundled-rclone.dmg",
              "os": "macos-15-intel",
              "artifact": "mountlet-macos-x64-standard",
              "artifact-path": "app/artifacts/mountlet-macos-x64-bundled-rclone.dmg"
            }
          ]
        }
      build-command: npm run tauri:build
      check-command: npm run build && cargo test --locked -j 2 --manifest-path src-tauri/Cargo.toml && cargo clippy --locked
        -j 2 --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      app-hooks: true
      retention-days: 14
      environment-json: >-
        ${{ format('{{"MOUNTLET_BUILD_CHANNEL":{0},"MOUNTLET_STORE_IDENTITY_NAME":{1},"MOUNTLET_STORE_PUBLISHER":{2},"MOUNTLET_STORE_PUBLISHER_DISPLAY_NAME":{3}}}',
        toJSON(needs.release-policy.outputs.channel),
        toJSON(format('{0}', vars.MOUNTLET_STORE_IDENTITY_NAME)),
        toJSON(format('{0}', vars.MOUNTLET_STORE_PUBLISHER)),
        toJSON(format('{0}', vars.MOUNTLET_STORE_PUBLISHER_DISPLAY_NAME))) }}
    secrets:
      build-environment: ${{ format('{{"MOUNTLET_DRIVE_CLIENT_ID":{0},"MOUNTLET_DRIVE_CLIENT_SECRET":{1},"MOUNTLET_GPHOTOS_CLIENT_ID":{2},"MOUNTLET_GPHOTOS_CLIENT_SECRET":{3},"MOUNTLET_DROPBOX_CLIENT_ID":{4},"MOUNTLET_DROPBOX_CLIENT_SECRET":{5},"MOUNTLET_ONEDRIVE_CLIENT_ID":{6},"MOUNTLET_ONEDRIVE_CLIENT_SECRET":{7},"MOUNTLET_BOX_CLIENT_ID":{8},"MOUNTLET_BOX_CLIENT_SECRET":{9},"MOUNTLET_PCLOUD_CLIENT_ID":{10},"MOUNTLET_PCLOUD_CLIENT_SECRET":{11}}}',
        toJSON(format('{0}', secrets.MOUNTLET_DRIVE_CLIENT_ID)), toJSON(format('{0}', secrets.MOUNTLET_DRIVE_CLIENT_SECRET)), toJSON(format('{0}', secrets.MOUNTLET_GPHOTOS_CLIENT_ID)),
        toJSON(format('{0}', secrets.MOUNTLET_GPHOTOS_CLIENT_SECRET)), toJSON(format('{0}', secrets.MOUNTLET_DROPBOX_CLIENT_ID)), toJSON(format('{0}', secrets.MOUNTLET_DROPBOX_CLIENT_SECRET)),
        toJSON(format('{0}', secrets.MOUNTLET_ONEDRIVE_CLIENT_ID)), toJSON(format('{0}', secrets.MOUNTLET_ONEDRIVE_CLIENT_SECRET)), toJSON(format('{0}', secrets.MOUNTLET_BOX_CLIENT_ID)),
        toJSON(format('{0}', secrets.MOUNTLET_BOX_CLIENT_SECRET)), toJSON(format('{0}', secrets.MOUNTLET_PCLOUD_CLIENT_ID)), toJSON(format('{0}', secrets.MOUNTLET_PCLOUD_CLIENT_SECRET)))
        }}
  upload-installers:
    name: Upload installers to R2
    needs: [release-policy, package]
    runs-on: ubuntu-24.04
    if: needs.release-policy.outputs.upload == 'true'
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      MOUNTLET_R2_BUCKET: ${{ needs.release-policy.outputs.channel == 'preview' && vars.MOUNTLET_PREVIEW_R2_BUCKET || vars.MOUNTLET_PRODUCTION_R2_BUCKET
        }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/download-artifact@v4
      with:
        pattern: mountlet-*
        path: release-artifacts
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - name: Check upload configuration
      shell: bash
      run: |
        test -n "$CLOUDFLARE_ACCOUNT_ID"
        test -n "$CLOUDFLARE_R2_ACCESS_KEY_ID"
        test -n "$CLOUDFLARE_R2_SECRET_ACCESS_KEY"
        test -n "$MOUNTLET_R2_BUCKET"
    - name: Upload installers
      run: |
        npm run web:r2:upload -- "$MOUNTLET_R2_BUCKET" release-artifacts --remote
  publish-apt:
    name: Publish Linux package to APT
    needs: [release-policy, package]
    # A failed Windows/macOS matrix leg must not suppress tested Linux packages.
    # The reusable publisher requires both named Linux artifacts before dispatch.
    if: ${{ !cancelled() && needs.release-policy.result == 'success' && needs.release-policy.outputs.publish-apt == 'true' }}
    permissions:
      contents: read
      actions: read
    uses: 1100soft/CI/.github/workflows/apt-publish.yml@31cd08b2a9314c358ce2589a095b5cbeb8dcadf7
    with:
      artifact-inputs: '{"mountlet-linux-x64-standard": "apt-input/standard", "mountlet-linux-x64-lean": "apt-input/lean"}'
      prepare-command: |
        set -euo pipefail
        if [ "${{ needs.release-policy.outputs.channel }}" = "preview" ]; then
          channel=preview
          release_id="${GITHUB_RUN_NUMBER}+g${GITHUB_SHA::7}"
        else
          channel=stable
          release_id="${{ github.ref_name }}"
        fi
        bash .github/scripts/prepare-apt-packages.sh \
          apt-input/standard/*.deb apt-input/lean/*.deb apt-packages "$channel" "$release_id"
    secrets:
      APT_DISPATCH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
