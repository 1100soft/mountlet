name: Native package CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/package.yml"
      - "app/**"
  push:
    branches: [main, wip]
    tags:
      - "v*.*.*"
    paths:
      - ".github/workflows/package.yml"
      - "app/**"

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"

concurrency:
  group: native-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.label }} / ${{ matrix.variant_label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            variant_label: system rclone
            runner: ubuntu-24.04
            artifact: mountlet-linux-x64-system-rclone
            archive: mountlet-linux-x64-system-rclone.tar.gz
            installer: mountlet-linux-x64-system-rclone.deb
            bundle_rclone: false
          - label: Linux x64
            variant_label: bundled rclone
            runner: ubuntu-24.04
            artifact: mountlet-linux-x64-bundled-rclone
            archive: mountlet-linux-x64-bundled-rclone.tar.gz
            installer: mountlet-linux-x64-bundled-rclone.deb
            bundle_rclone: true
          - label: Windows x64
            variant_label: system rclone
            runner: windows-2025
            artifact: mountlet-windows-x64-system-rclone
            archive: mountlet-windows-x64-system-rclone.zip
            installer: mountlet-windows-x64-system-rclone-setup.exe
            bundle_rclone: false
          - label: Windows x64
            variant_label: bundled rclone
            runner: windows-2025
            artifact: mountlet-windows-x64-bundled-rclone
            archive: mountlet-windows-x64-bundled-rclone.zip
            installer: mountlet-windows-x64-bundled-rclone-setup.exe
            bundle_rclone: true
          - label: macOS arm64
            variant_label: system rclone
            runner: macos-15
            artifact: mountlet-macos-arm64-system-rclone
            archive: mountlet-macos-arm64-system-rclone.zip
            installer: mountlet-macos-arm64-system-rclone.dmg
            bundle_rclone: false
          - label: macOS arm64
            variant_label: bundled rclone
            runner: macos-15
            artifact: mountlet-macos-arm64-bundled-rclone
            archive: mountlet-macos-arm64-bundled-rclone.zip
            installer: mountlet-macos-arm64-bundled-rclone.dmg
            bundle_rclone: true
          - label: macOS x64
            variant_label: system rclone
            runner: macos-15-intel
            artifact: mountlet-macos-x64-system-rclone
            archive: mountlet-macos-x64-system-rclone.zip
            installer: mountlet-macos-x64-system-rclone.dmg
            bundle_rclone: false
          - label: macOS x64
            variant_label: bundled rclone
            runner: macos-15-intel
            artifact: mountlet-macos-x64-bundled-rclone
            archive: mountlet-macos-x64-bundled-rclone.zip
            installer: mountlet-macos-x64-bundled-rclone.dmg
            bundle_rclone: true

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and build tools
        working-directory: app
        run: python -m pip install --upgrade --editable ".[desktop,packaging]"

      - name: Install Windows mount prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install rclone winfsp --no-progress --yes

      - name: Install Linux rclone for tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes rclone

      - name: Install macOS rclone for tests
        if: runner.os == 'macOS'
        run: brew install rclone

      - name: Run unit tests
        working-directory: app
        run: python packaging/run_tests.py

      - name: Verify Windows directory mounting
        if: runner.os == 'Windows'
        working-directory: app
        run: python packaging/windows_mount_smoke.py

      - name: Stage bundled rclone
        if: matrix.bundle_rclone
        working-directory: app
        run: python packaging/stage_rclone.py

      - name: Build native bundle
        working-directory: app
        run: python -m PyInstaller --clean --noconfirm packaging/mountlet.spec

      - name: Ad-hoc sign macOS test bundle
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - --timestamp=none app/dist/Mountlet.app

      - name: Verify native bundle
        working-directory: app
        env:
          MOUNTLET_EXPECT_BUNDLED_RCLONE: ${{ matrix.bundle_rclone }}
        run: python packaging/verify_bundle.py

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress --yes
          }

      - name: Archive native bundle
        working-directory: app
        run: python packaging/archive_bundle.py --name ${{ matrix.artifact }}

      - name: Build native installer
        working-directory: app
        run: python packaging/build_installer.py --name ${{ matrix.installer }}

      - name: Verify native installer
        working-directory: app
        env:
          MOUNTLET_EXPECT_BUNDLED_RCLONE: ${{ matrix.bundle_rclone }}
        run: python packaging/verify_installer.py artifacts/${{ matrix.installer }}

      - name: Upload native bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            app/artifacts/${{ matrix.archive }}
            app/artifacts/${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
