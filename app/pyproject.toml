[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mountlet"
version = "0.6.3"
description = "Desktop app for managing many cloud storage accounts in one place"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42",
  "tomli>=2; python_version < '3.11'",
]
license = "LicenseRef-Mountlet-Source-Available"
license-files = ["LICENSE"]
authors = [
  {name = "Eric Holt"},
]
keywords = ["rclone", "mount", "cloud-storage", "desktop", "fuse"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]

[project.optional-dependencies]
desktop = [
  "PySide6-Essentials>=6.7",
  "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
]
tray = [
  "PySide6-Essentials>=6.7",
  "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.4",
  "twine>=6",
]
packaging = [
  "Pillow>=10",
  "PyInstaller>=6.20,<7",
]

[project.urls]
Homepage = "https://github.com/eric-holt/mountlet"
Issues = "https://github.com/eric-holt/mountlet/issues"

[project.scripts]
mountlet = "mountlet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mountlet = ["assets/*.png", "assets/*.icns", "assets/*.svg", "assets/providers/*.png", "assets/providers/*.svg", "assets/providers/*.md"]

[tool.ruff]
line-length = 120
target-version = "py310"
